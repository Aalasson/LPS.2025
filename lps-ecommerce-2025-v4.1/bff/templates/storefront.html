
<!doctype html><html lang='pt-br'><meta charset='utf-8'><title>Storefront • LPS Demo</title>
<body style='font-family: system-ui, Arial; margin:20px'>
<h2>Storefront</h2>
<div>
  <label>Session ID <input id='sid' value='demo-123'></label>
  <label>CEP <input id='zip' placeholder='00000000'></label>
  <label>Pagamento <select id='pay'></select></label>
  <button onclick='refreshAll()'>Atualizar</button>
</div>
<h3>Microserviços</h3><div id='svc'></div>
<h3>Catálogo</h3><div id='catalog'></div>
<h3>Carrinho</h3><div id='cart'></div>
<h3>Frete</h3><div id='ship'>Informe CEP e clique em calcular.</div><button onclick='quote()'>Calcular frete</button>
<h3>Checkout</h3><div id='checkout'></div><button onclick='checkout()'>Finalizar compra</button>
<h3>Recomendações</h3><div id='reco'></div>
<script>
const API = location.origin;
const el = (id)=>document.getElementById(id);
const sid = ()=> el('sid').value || 'demo-123';
async function j(url, opts={}){ const r=await fetch(url, opts); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function status(){
  const s=await j(`${API}/api/v1/status`);
  el('pay').innerHTML = (s.config.payments||[]).map(p=>`<option>${p}</option>`).join('');
}
async function catalog(){
  const data=await j(`${API}/api/v1/catalog/products`);
  el('catalog').innerHTML = data.map(p=>`<div style="margin:6px 0">
    <b>${p.sku}</b> - ${p.name} — R$ ${p.price.toFixed(2)}
    <button onclick="addToCart('${p.sku}')">+ Carrinho</button>
    <button onclick="reco('${p.sku}')">Ver similares</button>
  </div>`).join('');
}
async function cart(){
  const data=await j(`${API}/api/v1/cart`, { headers:{'X-Session-Id': sid()} });
  const items=data.items||{};
  el('cart').innerHTML = Object.keys(items).length? Object.entries(items).map(([sku,qty])=>
    `<div>${sku} — qtd ${qty}
      <button onclick="addToCart('${sku}')">+</button>
      <button onclick="delFromCart('${sku}')">remover</button>
    </div>`).join('') : 'Vazio';
}
async function addToCart(sku){
  await j(`${API}/api/v1/cart/items`, { method:'POST', headers:{'Content-Type':'application/json','X-Session-Id':sid()}, body:JSON.stringify({sku,qty:1}) });
  await cart();
}
async function delFromCart(sku){
  await j(`${API}/api/v1/cart/items/${sku}`, { method:'DELETE', headers:{'X-Session-Id':sid()} });
  await cart();
}
async function quote(){
  try{
    const z=el('zip').value||'00000000';
    const q=await j(`${API}/api/v1/shipping/quote?zip=${encodeURIComponent(z)}`, { headers:{'X-Session-Id':sid()} });
    el('ship').textContent = `${q.mode} — R$ ${q.cost.toFixed(2)} • ETA ${q.eta_days} dia(s) [${q.carrier}]`;
  }catch(e){ el('ship').textContent = 'Erro: '+e.message; }
}
async function checkout(){
  try{
    const method = el('pay').value || 'pix';
    const r = await j(`${API}/api/v1/checkout/start`, { method:'POST', headers:{'Content-Type':'application/json','X-Session-Id':sid()}, body:JSON.stringify({payment_method:method})});
    el('checkout').textContent = `Pedido #${r.order_id} • Total R$ ${r.total.toFixed(2)}`;
  }catch(e){ el('checkout').textContent = 'Erro: '+e.message; }
}
async function reco(sku){
  try{
    const r=await j(`${API}/api/v1/recommendations?context=product&item_id=${encodeURIComponent(sku)}&limit=6`);
    el('reco').innerHTML = (r.items||[]).map(i=>`<span style="margin:2px;padding:2px 6px;border:1px solid #ddd;border-radius:999px">${i.item_id}</span>`).join('');
  }catch{ el('reco').textContent='Recomendações indisponíveis'; }
}
async function refreshAll(){ await status(); await catalog(); await cart(); }
refreshAll();
</script>
</body></html>
