
<!doctype html><html lang='pt-br'><meta charset='utf-8'><body style='font-family: system-ui, Arial; margin:24px'>
<h1>Seletor de Features</h1>
<form method='post' action='/config'>
  <p>Locale: <input name='locale' value='pt-BR'></p>
  <p>Moeda: <input name='currency' value='BRL'></p>
  <p>Pagamentos: <input name='payments' value='card,pix,boleto,wallet'></p>
  <p>Recomendação:
    <select name='reco_strategy'>
      <option value='off'>off</option>
      <option value='content' selected>content</option>
    </select>
  </p>
  <p>Checkout convidado:
    <select name='checkout_guest'><option value='true' selected>true</option><option value='false'>false</option></select>
    One-click:
    <select name='checkout_oneclick'><option value='false' selected>false</option><option value='true'>true</option></select>
  </p>
  <p>Frete habilitado:
    <select name='shipping_enabled'><option value='true' selected>true</option><option value='false'>false</option></select>
    Modo:
    <select name='shipping_mode'><option value='transportadora' selected>transportadora</option><option value='retirada'>retirada</option></select>
  </p>
  <button type='submit'>Gerar features.yaml</button>
</form>
</body></html>
